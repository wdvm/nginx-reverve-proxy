# Virtual host: edp.localhost -> Docker service "edp" on port 3001
#
# To add another app:
#   1. Create apps/<name>/ with its own Dockerfile
#   2. Add a service in docker-compose.yml on the "proxy" network
#   3. Copy this file to conf.d/<name>.conf and update server_name + upstream

upstream edp_backend {
    # Docker Compose DNS resolves service names on the internal network
    server edp:3001;

    # Reuse connections to the backend for better performance
    keepalive 32;
}

server {
    listen 443 ssl http2;
    server_name edp.2ulabs.com.br;

    ssl_certificate     /etc/nginx/ssl/edp.crt;
    ssl_certificate_key /etc/nginx/ssl/edp.key;

    include /etc/nginx/snippets/ssl-params.conf;  # optional hardened params

    location / {
        proxy_pass         http://edp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }
}

server {
    listen 80;
    server_name edp.localhost;
    return 301 https://$host$request_uri;
}

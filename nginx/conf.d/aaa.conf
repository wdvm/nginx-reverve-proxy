# Virtual host: aaa.localhost -> Docker service "aaa" on port 3000
#
# To add another app:
#   1. Create apps/<name>/ with its own Dockerfile
#   2. Add a service in docker-compose.yml on the "proxy" network
#   3. Copy this file to conf.d/<name>.conf and update server_name + upstream

upstream aaa_backend {
    # Docker Compose DNS resolves service names on the internal network
    server aaa:3000;

    # Reuse connections to the backend for better performance
    keepalive 32;
}

server {
    listen 80;
    server_name aaa.localhost;

    # HTTPS (port 443) is enabled by uncommenting the SSL server block at the
    # bottom of this file once certificates are in place. Until then, only HTTP
    # is served — the host port 443 mapping stays ready for when you add TLS.

    # -------------------------------------------------------------------------
    # Health checks — short timeouts so load balancers fail fast
    # -------------------------------------------------------------------------
    location = /health {
        proxy_pass         http://aaa_backend/health;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    5s;
        proxy_read_timeout    5s;
    }

    # -------------------------------------------------------------------------
    # Application traffic
    # -------------------------------------------------------------------------
    location / {
        proxy_pass         http://aaa_backend;
        proxy_http_version 1.1;

        # Standard reverse-proxy headers for the backend app
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # WebSocket support
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # Timeouts — balanced for APIs; tighten for pure health probes above
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Disable buffering for streaming / SSE / WebSocket-heavy workloads
        proxy_buffering off;
    }
}


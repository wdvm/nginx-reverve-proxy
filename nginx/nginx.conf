# Main NGINX configuration for the reverse proxy.
# Per-application routing lives in conf.d/*.conf — add a new file per subdomain.

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Structured access log for observability
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    # Hide version in error pages and headers
    server_tokens off;

    # WebSocket upgrade map — used by proxy_set_header Connection
    map $http_upgrade $connection_upgrade {
        default  upgrade;
        ''       close;
    }

    # Include one conf file per app/subdomain (aaa.conf, bbb.conf, …)
    include /etc/nginx/conf.d/*.conf;
}
